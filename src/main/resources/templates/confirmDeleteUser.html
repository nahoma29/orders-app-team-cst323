<!-- confirm delete user page -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Confirm Delete</title>

    <!-- bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<div class="container">
    <h1>Confirm Delete</h1>

    <p>Are you sure you want to delete the user
        <strong th:text="${user.username}">username</strong>?</p>

    <form th:action="@{/admin/users/delete}" method="post">
        <input type="hidden" name="id" th:value="${user.id}">
        <button class="btn btn-danger" type="submit">Delete</button>
        <a class="btn btn-secondary" th:href="@{/admin/users}">Cancel</a>
    </form>
</div>
</body>
</html>
