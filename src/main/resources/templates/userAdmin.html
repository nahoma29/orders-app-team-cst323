<!-- show all users in thymeleaf -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Administration</title>

    <!-- bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>
<div class="container">
    <h1>User Administration</h1>

    <div class="alert alert-success" th:if="${message}" th:text="${message}">Message</div>

    <table class="table table-bordered">
        <thead>
        <tr>
            <th>Username</th>
            <th>Role</th>
            <th>Enabled</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.username}">Username</td>
            <td th:text="${user.role}">Role</td>
            <td th:text="${user.enabled}">Enabled</td>
            <td>
                <a class="btn btn-primary"
                   th:href="@{/admin/users/edit/{id}(id=${user.id})}">Edit</a>

                <a class="btn btn-danger"
                   th:href="@{/admin/users/delete/{id}(id=${user.id})}">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
