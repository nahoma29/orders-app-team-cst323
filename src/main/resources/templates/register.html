<!-- register page -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>

    <!-- bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<div class="container">
    <h1>Register</h1>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error message</div>

    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" type="text" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" required>
        </div>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>

    <p class="mt-3">Already registered? <a th:href="@{/login}">Login</a></p>
</div>
</body>
</html>
